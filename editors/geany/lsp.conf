# Geany LSP Client configuration for the IE Lua language server.
#
# Merge these sections into your user configuration, which
# Tools -> LSP Client -> User Configuration opens. Replace the install path below.
#
# Section names match the filetype names in Tools -> Configuration Files ->
# filetype_extensions.conf, so the server is attached to Geany's Lua filetype. The plugin sends the
# filetype's language id, and `lang_id_mappings` overrides it per glob, which is what routes .lua to
# "ie-lua" and .menu to "ie-menu" through a single server process.

[all]
# The plugin is off for new projects by default; turn it on here or per project.
enable_by_default=true

[Lua]
cmd=node /absolute/path/to/ie-lua-language-server/dist/server/server.js --stdio

# Both globs are handled by this one server entry. Without the .menu mapping, a .menu file would
# either not reach the server or arrive under the wrong language id, and its embedded Lua regions
# would not be analysed.
lang_id_mappings=ie-lua;*.lua;ie-menu;*.menu

# Infinity Engine trees are edited as often outside a Geany project as inside one.
use_without_project=true
use_outside_project_dir=true

# Same keys as the Visual Studio Code extension; delivered as the LSP initialization options.
initialization_options={"ieLua": {"validation": {"mode": "save", "debounceMs": 300}}}
