workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

stages:
  - install
  - check
  - test
  - security
  - package
  - publish

.node_job:
  image: node:24-bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --progress=false

install:
  stage: install
  extends: .node_job
  script:
    - node --version
    - npm --version
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

compile:
  stage: check
  extends: .node_job
  needs:
    - install
  script:
    - npm run compile
  artifacts:
    expire_in: 1 day
    paths:
      - dist/

lint:
  stage: check
  extends: .node_job
  needs:
    - install
  script:
    - npm run lint
    - npm run format:check

unit_tests:
  stage: test
  extends: .node_job
  needs:
    - install
    - job: compile
      artifacts: false
  script:
    - npm test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/

package_vsix:
  stage: package
  extends: .node_job
  dependencies: []
  script:
    - npm run package
    - npm run package:audit
  artifacts:
    expire_in: 1 week
    paths:
      - '*.vsix'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

package_prerelease_vsix:
  stage: package
  extends: .node_job
  dependencies: []
  script:
    - npm run package:pre-release
    - npm run package:audit
  artifacts:
    expire_in: 1 week
    paths:
      - '*.vsix'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|pre|preview)\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: security
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

secret_detection:
  stage: security
  variables:
    SECRET_DETECTION_ENABLED: 'true'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

publish_marketplace:
  stage: publish
  extends: .node_job
  needs:
    - package_vsix
  script:
    - npx vsce publish --packagePath ./*.vsix --pat "$VSCE_PAT"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
      allow_failure: true

publish_marketplace_prerelease:
  stage: publish
  extends: .node_job
  needs:
    - package_prerelease_vsix
  script:
    - npx vsce publish --pre-release --packagePath ./*.vsix --pat "$VSCE_PAT"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|pre|preview)\.[0-9]+$/'
      when: manual
      allow_failure: true

gitlab_prerelease:
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:latest
  before_script: []
  needs:
    - package_prerelease_vsix
  script:
    - echo "Creating GitLab prerelease ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'IE Lua Language Server $CI_COMMIT_TAG'
    description: 'Prerelease build. Download the VSIX from this tag pipeline package_prerelease_vsix job artifacts.'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|pre|preview)\.[0-9]+$/'
      when: manual
      allow_failure: true
