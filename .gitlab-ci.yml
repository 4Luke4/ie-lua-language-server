workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

stages:
  - install
  - check
  - test
  - security
  - package
  - release
  # - publish

variables:
  SECRET_DETECTION_ENABLED: 'true'
  SAST_EXCLUDED_PATHS: 'spec, test, tests, tmp, node_modules, dist, coverage, resources/api'
  SECRET_DETECTION_EXCLUDED_PATHS: 'node_modules, dist, coverage, resources/api'

.node_job:
  image: node:24-bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --progress=false

install:
  stage: install
  extends: .node_job
  script:
    - node --version
    - npm --version
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

compile:
  stage: check
  extends: .node_job
  needs:
    - install
  script:
    - npm run compile
  artifacts:
    expire_in: 1 day
    paths:
      - dist/

lint:
  stage: check
  extends: .node_job
  needs:
    - install
  script:
    - npm run lint
    - npm run format:check

unit_tests:
  stage: test
  extends: .node_job
  needs:
    - install
    - job: compile
      artifacts: false
  script:
    - npm test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/

package_vsix:
  stage: package
  extends: .node_job
  dependencies: []
  script:
    - npm run package
    - npm run package:audit
  artifacts:
    access: none
    expire_in: 1 week
    paths:
      - '*.vsix'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

package_prerelease_vsix:
  stage: package
  extends: .node_job
  dependencies: []
  script:
    - npm run package:pre-release
    - npm run package:audit
  artifacts:
    access: none
    expire_in: 1 week
    paths:
      - '*.vsix'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|pre|preview)\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# Stage-only overrides mirror GitLab's template customization pattern. Do not
# override `sast.rules`; the template parent is configuration-only.
sast:
  stage: security

secret_detection:
  stage: security

# GitLab release automation remains active. Package jobs hand off hidden VSIX
# artifacts to the release jobs, which publish the VSIX as a GitLab package and
# expose only that package as the release asset.
.gitlab_release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  before_script: []
  script:
    - |
      set -eu

      vsix_file="$(find . -maxdepth 1 -name '*.vsix' -type f | sort | head -n 1)"
      if [ -z "$vsix_file" ]; then
        echo "No VSIX artifact was passed to ${CI_JOB_NAME}."
        exit 1
      fi

      release_vsix="ie-lua-language-server-${CI_COMMIT_TAG}.vsix"
      package_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ie-lua-language-server/${CI_COMMIT_TAG}/${release_vsix}"
      package_endpoint="projects/${CI_PROJECT_ID}/packages/generic/ie-lua-language-server/${CI_COMMIT_TAG}/${release_vsix}"
      cp "$vsix_file" "$release_vsix"

      if command -v glab >/dev/null 2>&1; then
        GITLAB_TOKEN="${CI_JOB_TOKEN}" GLAB_TOKEN="${CI_JOB_TOKEN}" glab api \
          --hostname "${CI_SERVER_HOST}" \
          --method PUT \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --input "$release_vsix" \
          "$package_endpoint"
      elif command -v curl >/dev/null 2>&1; then
        curl --fail --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$release_vsix" "$package_url"
      else
        echo "glab or curl is required to upload the VSIX to the GitLab package registry."
        exit 1
      fi
      echo "Uploaded ${release_vsix} to the GitLab generic package registry."

gitlab_release:
  extends: .gitlab_release_job
  needs:
    - job: package_vsix
      artifacts: true
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'IE Lua Language Server $CI_COMMIT_TAG'
    description: 'Stable release build. Download the VSIX from this release asset.'
    assets:
      links:
        - name: 'ie-lua-language-server-$CI_COMMIT_TAG.vsix'
          url: '$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ie-lua-language-server/$CI_COMMIT_TAG/ie-lua-language-server-$CI_COMMIT_TAG.vsix'
          link_type: 'package'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
      allow_failure: true

gitlab_prerelease:
  extends: .gitlab_release_job
  needs:
    - job: package_prerelease_vsix
      artifacts: true
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'IE Lua Language Server $CI_COMMIT_TAG'
    description: 'Prerelease build. Download the VSIX from this release asset.'
    assets:
      links:
        - name: 'ie-lua-language-server-$CI_COMMIT_TAG.vsix'
          url: '$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ie-lua-language-server/$CI_COMMIT_TAG/ie-lua-language-server-$CI_COMMIT_TAG.vsix'
          link_type: 'package'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|pre|preview)\.[0-9]+$/'
      when: manual
      allow_failure: true

