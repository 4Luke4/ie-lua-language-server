version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Remove when the TypeScript ESLint toolchain supports TypeScript 7.
      - dependency-name: typescript
        versions:
          - '>=7.0.0 <8.0.0'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
