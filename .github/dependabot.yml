version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The extension intentionally supports the VS Code 1.100 API baseline.
      - dependency-name: "@types/vscode"
        update-types: [version-update:semver-minor, version-update:semver-major]
      # Remove when the TypeScript ESLint toolchain supports TypeScript 7.
      - dependency-name: typescript
        versions:
          - '>=7.0.0 <8.0.0'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      codeql:
        patterns:
          - github/codeql-action*
