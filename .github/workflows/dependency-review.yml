name: Dependency review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  # Required only to publish a concise report when the review fails.
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Build and development dependencies execute in trusted CI and release jobs,
          # so vulnerabilities in every dependency scope are relevant to this project.
          fail-on-scopes: runtime, development, unknown
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          retry-on-snapshot-warnings: true
          show-patched-versions: true
