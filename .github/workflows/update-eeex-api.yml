name: Update EEex API data

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-eeex-api-data
  cancel-in-progress: false

jobs:
  generate:
    name: Generate API update without write credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.revision.outputs.changed }}
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve upstream revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(gh api repos/Bubb13/EEex-Docs/commits/dev --jq '.sha')"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          current="$(node -p "require('./resources/api/api-index.json').sources.find(s => s.id === 'ee-game-structures-x64').commit")"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [[ "$commit" == "$current" ]]; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.revision.outputs.changed == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.revision.outputs.changed == 'true'
        run: npm ci --no-audit --progress=false
      - if: steps.revision.outputs.changed == 'true'
        run: npm run compile
      - if: steps.revision.outputs.changed == 'true'
        env:
          IE_LUA_EEEX_COMMIT: ${{ steps.revision.outputs.commit }}
        run: node scripts/regenerate.cjs
      - if: steps.revision.outputs.changed == 'true'
        run: npx --no-install prettier --write resources/api
      - if: steps.revision.outputs.changed == 'true'
        run: npm run verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.revision.outputs.changed == 'true'
        with:
          name: eeex-api-data
          path: resources/api/
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Open reviewable API pull request
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eeex-api-data
          path: generated
      - name: Commit data with the GitHub API
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          UPSTREAM_COMMIT: ${{ needs.generate.outputs.commit }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const scope = { owner: context.repo.owner, repo: context.repo.repo };
            const upstream = process.env.UPSTREAM_COMMIT;
            if (!/^[0-9a-f]{40}$/.test(upstream)) throw new Error('Invalid source revision');
            const branch = `automation/eeex-api-${upstream.slice(0,12)}`;
            const previous = await github.rest.pulls.list({ ...scope, head: `${scope.owner}:${branch}`, state: 'all' });
            if (previous.data.length) { core.info(`Existing update: ${previous.data[0].html_url}`); return; }
            // The generator used this exact commit; never overwrite newer base-branch data.
            const { data: base } = await github.rest.git.getCommit({ ...scope, commit_sha: context.sha });
            const { data: tree } = await github.rest.git.getTree({ ...scope, tree_sha: base.tree.sha, recursive: 'true' });
            if (tree.truncated) throw new Error('Repository tree truncated');
            const entries = [];
            const visit = directory => {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const file = path.join(directory, entry.name);
                if (entry.isDirectory()) visit(file);
                else if (entry.isFile() && entry.name.endsWith('.json')) {
                  const content = fs.readFileSync(file, 'utf8');
                  JSON.parse(content);
                  entries.push({ path: `resources/api/${path.relative('generated', file).split(path.sep).join('/')}`, mode: '100644', type: 'blob', content });
                } else if (entry.name !== 'AGENTS.md') throw new Error(`Unexpected generated file: ${file}`);
              }
            };
            visit('generated');
            const names = new Set(entries.map(e => e.path));
            for (const entry of tree.tree) if (entry.type === 'blob' && entry.path.startsWith('resources/api/') && entry.path.endsWith('.json') && !names.has(entry.path)) entries.push({ path: entry.path, mode: '100644', type: 'blob', sha: null });
            const { data: generatedTree } = await github.rest.git.createTree({ ...scope, base_tree: base.tree.sha, tree: entries });
            const { data: commit } = await github.rest.git.createCommit({ ...scope, message: 'chore(data): update EEex API index', tree: generatedTree.sha, parents: [context.sha] });
            await github.rest.git.createRef({ ...scope, ref: `refs/heads/${branch}`, sha: commit.sha });
            const manifest = JSON.parse(fs.readFileSync('generated/api-index.json', 'utf8'));
            const counts = manifest.sections.map(s => `- ${s.title}: ${s.symbolCount} symbols`).join('\n');
            const body = `## Summary\n\nRegenerate EEex data from ${upstream}.\n\n${counts}\n\n## Validation\n\nGeneration and unit/data checks: ${context.serverUrl}/${scope.owner}/${scope.repo}/actions/runs/${context.runId}\n\nFull PR checks are pending. GitHub may require a maintainer to approve workflows to run. Do not merge until all required checks pass.`;
            await github.rest.pulls.create({ ...scope, base: context.payload.repository.default_branch, head: branch, title: 'chore(data): update EEex API index', body });
