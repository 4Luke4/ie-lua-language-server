name: Maintenance artifacts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare formatting and lockfile patch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --package-lock-only --ignore-scripts --no-audit --progress=false
      - run: npm ci --no-audit --progress=false
      - run: npm run format
      - name: Save patch without writing to the PR branch
        if: always()
        run: node scripts/maintenance.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: maintenance-patch
          path: reports/
          retention-days: 7
