name: Codex CodeQL remediation

on:
  workflow_run:
    workflows:
      - CodeQL
    types:
      - completed

permissions: {}

concurrency:
  group: codex-codeql-remediation-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  generate-fix:
    name: Generate reviewed patch
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: read
    outputs:
      alert_count: ${{ steps.alerts.outputs.alert_count }}
      codex_summary: ${{ steps.codex.outputs['final-message'] }}
      has_patch: ${{ steps.diff.outputs.has_patch }}
    steps:
      - name: Check out analyzed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --progress=false
      - name: Collect open CodeQL alerts
        id: alerts
        env:
          ALERTS_FILE: .codex-codeql-alerts.json
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            --method GET \
            --paginate \
            --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts" \
            -f state=open \
            -f tool_name=CodeQL \
            -f ref="refs/heads/${DEFAULT_BRANCH}" \
            -f per_page=100 \
            --jq '
              flatten
              | map({
                  number,
                  html_url,
                  rule: {
                    id: .rule.id,
                    name: .rule.name,
                    description: .rule.description,
                    severity: .rule.severity,
                    security_severity_level: .rule.security_severity_level,
                    tags: .rule.tags
                  },
                  instance: {
                    ref: .most_recent_instance.ref,
                    commit_sha: .most_recent_instance.commit_sha,
                    message: .most_recent_instance.message.text,
                    location: .most_recent_instance.location
                  }
                })
            ' > "$ALERTS_FILE"

          alert_count="$(jq 'length' "$ALERTS_FILE")"
          echo "alert_count=$alert_count" >> "$GITHUB_OUTPUT"
          if ((alert_count > 0)); then
            echo 'has_alerts=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_alerts=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Generate CodeQL remediation with Codex
        id: codex
        if: steps.alerts.outputs.has_alerts == 'true'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          allow-bots: true
          allow-bot-users: 'dependabot[bot]'
          codex-args: '["--ephemeral"]'
          prompt: |
            The trusted CodeQL workflow completed successfully for commit
            ${{ github.event.workflow_run.head_sha }} on the default branch.

            Open CodeQL alerts for that branch are recorded in
            .codex-codeql-alerts.json. Validate each alert against the current
            source before changing code. Implement the smallest safe fixes for
            alerts that are genuine and fixable, add focused regression tests,
            and run npm run verify.

            Do not dismiss alerts, weaken CodeQL, edit GitHub workflows, change
            unrelated behavior, or make speculative fixes. Leave an alert
            unchanged if it is a false positive or cannot be fixed safely, and
            explain that decision in the final summary.
      - name: Create patch artifact
        id: diff
        if: steps.alerts.outputs.has_alerts == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -f .codex-codeql-alerts.json
          git add -N .
          git diff --check
          git diff --binary HEAD > codex.patch
          if [[ -s codex.patch ]]; then
            echo 'has_patch=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_patch=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Codex patch
        if: steps.diff.outputs.has_patch == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-codeql-fix-${{ github.run_id }}-${{ github.run_attempt }}
          path: codex.patch
          if-no-files-found: error
          retention-days: 7

  open-pull-request:
    name: Open remediation pull request
    needs: generate-fix
    if: needs.generate-fix.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out analyzed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Download Codex patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-codeql-fix-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Apply and publish remediation
        env:
          ALERT_COUNT: ${{ needs.generate-fix.outputs.alert_count }}
          CODEX_SUMMARY: ${{ needs.generate-fix.outputs.codex_summary }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          git apply --index --binary codex.patch
          git diff --cached --check

          branch="codex/codeql-fix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m 'fix: address CodeQL findings via Codex'
          git push origin "$branch"

          {
            echo "Codex generated this remediation after CodeQL analyzed \`$HEAD_SHA\` on \`$DEFAULT_BRANCH\`."
            echo
            echo "- Source CodeQL run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
            echo "- Open CodeQL alerts supplied to Codex: $ALERT_COUNT"
            echo
            echo '## Codex summary'
            echo
            if [[ -n "$CODEX_SUMMARY" ]]; then
              printf '%s\n' "$CODEX_SUMMARY"
            else
              echo 'Codex did not provide a textual summary.'
            fi
            echo
            echo '## Review requirements'
            echo
            echo 'Review the patch and confirm CI and CodeQL results before merging.'
            echo 'This workflow does not dismiss alerts or merge its own pull requests.'
          } > pr-body.md

          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$branch" \
            --title 'fix: address CodeQL findings via Codex' \
            --body-file pr-body.md
