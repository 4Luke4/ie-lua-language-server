name: Label pull requests

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply path-based labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Do not check out pull-request code in a pull_request_target workflow.
      # Labels and labeler configuration are reconciled from the trusted base branch.
      - name: Reconcile label definitions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const scope = { owner: context.repo.owner, repo: context.repo.repo };
            const ref = context.payload.pull_request.base.sha;
            const read = async (path) => {
              const { data } = await github.rest.repos.getContent({ ...scope, path, ref });
              return Buffer.from(data.content, 'base64').toString('utf8');
            };
            const definitions = JSON.parse(await read('.github/labels.json'));
            // Only base-revision code is evaluated; never fetch executable code from the PR head.
            const implementation = await read('.github/scripts/reconcile-labels.cjs');
            const trustedModule = { exports: {} };
            new Function('module', implementation)(trustedModule);
            await trustedModule.exports(github, context, definitions);
      - name: Apply labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
          dot: true
