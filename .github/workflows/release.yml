name: Release

run-name: Release ${{ inputs.tag_name }} as ${{ inputs.release_type }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: VSIX and GitHub release type
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable
      tag_name:
        description: Stable vX.Y.Z or prerelease vX.Y.Z-{alpha|beta|rc|pre|preview}.N
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Validate release type, tag, and package version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          TAG_NAME: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          case "$RELEASE_TYPE" in
            stable)
              if [[ ! "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "Stable releases require a vX.Y.Z tag; received: $TAG_NAME" >&2
                exit 1
              fi
              ;;
            prerelease)
              if [[ ! "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-(alpha|beta|rc|pre|preview)\.([0-9]+)$ ]]; then
                echo "Prereleases require a vX.Y.Z-{alpha|beta|rc|pre|preview}.N tag; received: $TAG_NAME" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported release type: $RELEASE_TYPE" >&2
              exit 1
              ;;
          esac

          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          minor="${BASH_REMATCH[2]}"
          if [[ "$RELEASE_TYPE" == "stable" && $((10#$minor % 2)) -ne 0 ]]; then
            echo "Stable releases require an even minor version; received: $version" >&2
            exit 1
          fi
          if [[ "$RELEASE_TYPE" == "prerelease" && $((10#$minor % 2)) -eq 0 ]]; then
            echo "Prereleases require an odd minor version; received: $version" >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$version" ]]; then
            echo "Tag version $version does not match package.json version $package_version." >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --no-audit --progress=false
      - name: Verify
        run: npm run verify
      - name: Build prerelease VSIX
        if: inputs.release_type == 'prerelease'
        run: npm run package:pre-release
      - name: Build stable VSIX
        if: inputs.release_type == 'stable'
        run: npm run package
      - name: Audit package
        run: npm run package:audit
      - name: Prepare release asset
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t vsix_files < <(find . -maxdepth 1 -type f -name '*.vsix' -printf '%f\n' | sort)
          if [[ "${#vsix_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one VSIX artifact; found ${#vsix_files[@]}." >&2
            exit 1
          fi

          mv "${vsix_files[0]}" "ie-lua-language-server-${TAG_NAME}.vsix"
      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ie-lua-language-server-${{ inputs.tag_name }}
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ie-lua-language-server-${{ inputs.tag_name }}
          path: release-artifact
      - name: Locate release asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t vsix_files < <(find release-artifact -type f -name '*.vsix' -print | sort)
          if [[ "${#vsix_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one downloaded VSIX; found ${#vsix_files[@]}." >&2
            exit 1
          fi

          echo "path=${vsix_files[0]}" >> "$GITHUB_OUTPUT"
      - name: Validate publication prerequisites
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub release already exists for $TAG_NAME." >&2
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Git tag $TAG_NAME already exists." >&2
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          TAG_NAME: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            "$TAG_NAME"
            "${{ steps.asset.outputs.path }}"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --generate-notes
            --title "IE Lua Language Server $TAG_NAME"
          )
          if [[ "$RELEASE_TYPE" == "prerelease" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "${args[@]}"
