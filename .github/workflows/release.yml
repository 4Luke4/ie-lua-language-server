name: Release

run-name: Release ${{ inputs.tag_name }} (${{ inputs.dry_run && 'dry run' || 'publish' }})

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: VSIX and GitHub release type
        required: true
        default: prerelease
        type: choice
        options: [prerelease, stable]
      tag_name:
        description: Stable vX.Y.Z or prerelease vX.Y.Z-{alpha|beta|rc|pre|preview}.N
        required: true
        type: string
      dry_run:
        description: Verify everything without creating a tag or release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --progress=false
      - run: npm run release:check
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          TAG_NAME: ${{ inputs.tag_name }}
      - name: Check publication prerequisites without mutation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        with:
          script: |
            const scope = { owner: context.repo.owner, repo: context.repo.repo };
            for (const lookup of [
              () => github.rest.repos.getReleaseByTag({ ...scope, tag: process.env.TAG_NAME }),
              () => github.rest.git.getRef({ ...scope, ref: `tags/${process.env.TAG_NAME}` }),
            ]) {
              try { await lookup(); }
              catch (error) { if (error.status === 404) continue; throw error; }
              throw new Error('Release tag already exists');
            }
  verify:
    needs: validate
    uses: ./.github/workflows/verify.yml
  release:
    name: Publish GitHub release
    needs: [validate, verify]
    if: inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix-${{ inputs.release_type }}
          path: release-artifact
      - name: Require security and PR checks for the selected commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const scope = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: commit } = await github.rest.repos.getCommit({ ...scope, ref: context.sha });
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, { ...scope, commit_sha: commit.sha });
            const merged = pulls.find(pr => pr.merged_at && pr.base.ref === context.payload.repository.default_branch && pr.merge_commit_sha === context.sha);
            if (!merged) throw new Error('Publication requires a merged default-branch PR commit');
            const checks = await github.paginate(github.rest.checks.listForRef, { ...scope, ref: merged.head.sha, per_page: 100 });
            for (const name of ['Verify', 'Analyze JavaScript and TypeScript', 'Review dependency changes', 'Validate commit messages']) {
              const latest = checks.filter(c => c.name === name && c.app?.slug === 'github-actions').sort((a,b) => b.id-a.id)[0];
              if (latest?.conclusion !== 'success') throw new Error(`Missing successful ${name}`);
            }
      - name: Publish exactly the verified artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        with:
          script: |
            const fs = require('node:fs');
            const scope = { owner: context.repo.owner, repo: context.repo.repo };
            const files = fs.readdirSync('release-artifact');
            if (files.length !== 1 || files[0] !== 'extension.vsix') throw new Error('Expected exactly one verified VSIX');
            // Recheck immediately before mutation; API errors other than 404 are fatal.
            for (const lookup of [
              () => github.rest.repos.getReleaseByTag({ ...scope, tag: process.env.TAG_NAME }),
              () => github.rest.git.getRef({ ...scope, ref: `tags/${process.env.TAG_NAME}` }),
            ]) {
              try { await lookup(); }
              catch (error) { if (error.status === 404) continue; throw error; }
              throw new Error('Release tag already exists');
            }
            const prerelease = process.env.RELEASE_TYPE === 'prerelease';
            const { data: release } = await github.rest.repos.createRelease({ ...scope, tag_name: process.env.TAG_NAME, target_commitish: context.sha, name: `IE Lua Language Server ${process.env.TAG_NAME}`, draft: true, prerelease, generate_release_notes: true });
            await github.rest.repos.uploadReleaseAsset({ ...scope, release_id: release.id, name: `ie-lua-language-server-${process.env.TAG_NAME}.vsix`, data: fs.readFileSync('release-artifact/extension.vsix') });
            await github.rest.repos.updateRelease({ ...scope, release_id: release.id, draft: false, make_latest: prerelease ? 'false' : 'true' });
