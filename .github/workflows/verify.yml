name: Verification suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  policy:
    name: Policy and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --progress=false
      - run: npm run policy:check
      - run: npm run lint
      - run: npm run format:check
      - name: Validate Kate XML
        run: python3 -c "import xml.etree.ElementTree as E; E.parse('editors/kate/syntax/ie-menu.xml')"
      - name: Identify actionlint toolchain
        id: go
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Cache actionlint
        id: actionlint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/actionlint
          key: actionlint-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-1.7.12
      - name: Install pinned actionlint
        if: steps.actionlint.outputs.cache-hit != 'true'
        run: GOBIN="$GITHUB_WORKSPACE/.cache/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check workflows and embedded shell
        run: .cache/actionlint/actionlint -color

  editors:
    name: Resolve editor versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Resolve stable once without a stale-cache fallback
        id: versions
        shell: bash
        run: |
          stable="$(curl --fail --silent --show-error --retry 3 https://update.code.visualstudio.com/api/releases/stable | jq -er '.[0]')"
          [[ "$stable" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          versions="$(jq -cn --arg stable "$stable" '["1.100.0", $stable] | unique')"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit and stdio (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --progress=false
      - run: npm test
      - run: npm run bundle:client && npm run bundle:server
      - run: npm run package:audit
      - run: npm run test:lsp
        timeout-minutes: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: protocol-${{ matrix.os }}
          path: reports/
          retention-days: 7

  package:
    name: Package both channels
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --progress=false
      - run: npm run bundle
      - run: npm run package:audit
      - name: Package and audit both channels from one build
        run: |
          for channel in stable prerelease; do
            mkdir -p "artifacts/$channel"
            args=(--no-dependencies --out "artifacts/$channel/extension.vsix")
            if [[ "$channel" == prerelease ]]; then args+=(--pre-release); fi
            npx --no-install vsce package "${args[@]}"
            npm run package:audit:vsix -- "artifacts/$channel/extension.vsix" "$channel"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-stable
          path: artifacts/stable/extension.vsix
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-prerelease
          path: artifacts/prerelease/extension.vsix
          if-no-files-found: error
          retention-days: 7

  editor:
    name: Editor (${{ matrix.os }}, ${{ matrix.editor }}, ${{ matrix.channel }})
    needs: [package, editors]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        editor: ${{ fromJSON(needs.editors.outputs.versions) }}
        channel: [stable, prerelease]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --progress=false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix-${{ matrix.channel }}
          path: artifacts
      - name: Cache exact editor distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .vscode-test/vscode-*
          key: editor-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.editor }}-${{ hashFiles('package-lock.json') }}
      - name: Test installed extension
        shell: bash
        env:
          VSCODE_VERSION: ${{ matrix.editor }}
          PACKAGE_CHANNEL: ${{ matrix.channel }}
          VSIX_PATH: artifacts/extension.vsix
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a npm run test:editor
          else
            npm run test:editor
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: editor-${{ matrix.os }}-${{ matrix.editor }}-${{ matrix.channel }}
          path: reports/
          include-hidden-files: true
          retention-days: 7

  generated:
    name: Pinned API regeneration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --progress=false
      - run: npm run compile
      - run: node scripts/regenerate.cjs
      - run: npx --no-install prettier --write resources/api
      - name: Require reproducible committed data
        run: |
          git diff --stat -- resources/api
          git diff --quiet -- resources/api
      - run: npm run bundle:client && npm run bundle:server
      - run: npm run package:audit
      - name: Save reviewable regeneration patch
        if: always()
        run: node scripts/maintenance.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: generated-data-patch
          path: reports/
          retention-days: 7
