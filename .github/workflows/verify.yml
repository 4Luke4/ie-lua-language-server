name: Verification suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  policy:
    name: Policy and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --progress=false
      - run: npm run policy:check
      - run: npm run compile
      - run: npm run lint
      - run: npm run format:check
      - name: Validate Kate XML
        run: python3 -c "import xml.etree.ElementTree as E; E.parse('editors/kate/syntax/ie-menu.xml')"
      - name: Check workflows and embedded shell
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  unit:
    name: Unit and stdio (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --progress=false
      - run: npm test
      - run: npm run bundle
      - run: npm run package:audit
      - run: npm run test:lsp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: protocol-${{ matrix.os }}
          path: reports/
          retention-days: 7

  package:
    name: Package (${{ matrix.channel }})
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, prerelease]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --progress=false
      - run: npm run bundle
      - run: npm run package:audit
      - name: Package selected channel
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          mkdir -p artifacts
          args=(--no-dependencies --out artifacts/extension.vsix)
          if [[ "$CHANNEL" == prerelease ]]; then args+=(--pre-release); fi
          npx --no-install vsce package "${args[@]}"
      - name: Inspect actual VSIX
        env:
          CHANNEL: ${{ matrix.channel }}
        run: npm run package:audit:vsix -- artifacts/extension.vsix "$CHANNEL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-${{ matrix.channel }}
          path: artifacts/extension.vsix
          if-no-files-found: error
          retention-days: 7

  editor:
    name: Editor (${{ matrix.os }}, ${{ matrix.editor }}, ${{ matrix.channel }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        editor: ['1.100.0', stable]
        channel: [stable, prerelease]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --progress=false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix-${{ matrix.channel }}
          path: artifacts
      - name: Test installed extension
        shell: bash
        env:
          VSCODE_VERSION: ${{ matrix.editor }}
          PACKAGE_CHANNEL: ${{ matrix.channel }}
          VSIX_PATH: artifacts/extension.vsix
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a npm run test:editor
          else
            npm run test:editor
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: editor-${{ matrix.os }}-${{ matrix.editor }}-${{ matrix.channel }}
          path: |
            reports/
            .vscode-test/profile-*/user/logs/
          include-hidden-files: true
          retention-days: 7

  generated:
    name: Pinned API regeneration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --progress=false
      - run: npm run compile
      - run: node scripts/regenerate.cjs
      - run: npx --no-install prettier --write resources/api
      - name: Require reproducible committed data
        run: git diff --exit-code -- resources/api
      - run: npm run bundle
      - run: npm run package:audit
      - name: Save reviewable regeneration patch
        if: always()
        run: node scripts/maintenance.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: generated-data-patch
          path: reports/
          retention-days: 7
