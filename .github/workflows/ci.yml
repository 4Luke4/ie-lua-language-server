name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    uses: ./.github/workflows/verify.yml
  verify:
    name: Verify
    needs: suite
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the complete suite
        env:
          RESULT: ${{ needs.suite.result }}
        run: test "$RESULT" = success
