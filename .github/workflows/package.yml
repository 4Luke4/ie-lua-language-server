name: Package

on:
  workflow_dispatch:
    inputs:
      channel:
        description: VSIX release channel
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}-${{ inputs.channel }}
  cancel-in-progress: true

jobs:
  package:
    name: Build ${{ inputs.channel }} VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --progress=false
      - name: Verify
        run: npm run verify
      - name: Build prerelease VSIX
        if: inputs.channel == 'prerelease'
        run: npm run package:pre-release
      - name: Build stable VSIX
        if: inputs.channel == 'stable'
        run: npm run package
      - name: Audit package
        run: npm run package:audit
      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ie-lua-language-server-${{ inputs.channel }}-${{ github.sha }}
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 7
