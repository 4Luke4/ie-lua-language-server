name: Conventional Commits

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: conventional-commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Conventional Commit headers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Squash titles and individual commits follow the same repository policy.
            const conventionalHeader =
              /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\([^()\r\n]+\))?!?: \S.*$/u;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const invalid = commits.flatMap((commit) => {
              const header = commit.commit.message.split(/\r?\n/u, 1)[0] ?? '';
              return header.length <= 100 && conventionalHeader.test(header)
                ? []
                : [`${commit.sha.slice(0, 7)}  ${header || '<empty message>'}`];
            });

            const title = context.payload.pull_request.title;
            if (title.length > 100 || !conventionalHeader.test(title)) invalid.push(`PR title: ${title}`);

            if (invalid.length > 0) {
              core.setFailed(
                [
                  'Every pull-request commit must use a Conventional Commit header:',
                  'type(optional-scope): description',
                  '',
                  ...invalid,
                ].join('\n'),
              );
            }
