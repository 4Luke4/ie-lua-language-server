# Every key below is an existing repository label. Keep path rules factual:
# semantic labels such as bug or enhancement require human judgment.
github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - .github/workflows/**

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - package-lock.json
          - packages/*/package.json

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - CHANGELOG.md
          - CONTRIBUTING.md
          - README.md
          - SECURITY.md
          - THIRD_PARTY_NOTICES.md
          - docs/**
          - "**/AGENTS.md"
          - AGENTS.md

javascript:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.cjs'
          - '**/*.js'
          - '**/*.mjs'
          - '**/*.ts'
          - '**/*.tsx'
